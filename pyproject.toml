[build-system]
# >=77 for PEP 639 SPDX `license` / `license-files` support.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsimons-template"
version = "0.1.0"
description = "Brief project description"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []
authors = [
    { name = "lsimons" }
]

# `mise run init` rewrites these, but only correctly for repos named
# `lsimons-<name>-<lang>`. Check them by hand after init otherwise.
[project.urls]
Homepage = "https://github.com/lsimons/lsimons-template-py"
Issues = "https://github.com/lsimons/lsimons-template-py/issues"

[project.scripts]
# template = "template.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["template*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N pep8-naming, UP pyupgrade,
# B bugbear, C4 comprehensions, SIM simplify, PTH pathlib,
# RUF ruff-specific.
#
# PTH is the opinionated one: PTH123 bans the builtin `open()` in favour
# of `Path.open()`. That is the intended default here, but it is a whole
# -project constraint — a derived project that disagrees should drop
# "PTH" from this list rather than sprinkle `# noqa: PTH123`.
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src", "tests"]
exclude = ["scripts/**", ".venv/**", "**/__pycache__/**"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "basedpyright>=1.39.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# --strict-markers/-config turn typos in markers and in this table into
# errors; xfail_strict fails a test that was expected to fail but passed.
addopts = "-v --strict-markers --strict-config --cov=template --cov-report=term-missing --cov-fail-under=80"
xfail_strict = true

[tool.uv]
exclude-newer = "1 week"
