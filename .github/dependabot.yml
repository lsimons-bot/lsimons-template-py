version: 2
updates:
  # "uv" is the ecosystem that understands uv.lock; "pip" reads only
  # pyproject.toml and would leave the lock file stale.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
