# mise: https://mise.jdx.dev/
#
# `mise install` installs everything under [tools]; `mise run <task>`
# dispatches to uv. `pyproject.toml`'s `requires-python` remains
# authoritative — mise reads it.

# Tool versions are pinned. `python` is pinned to the minor series so
# CPython patch releases (which are security fixes) are picked up
# automatically; `uv` is pinned exactly. Neither is covered by
# dependabot — refresh them deliberately with `mise up`.
[tools]
python = "3.14"
uv = "0.12.2"

[env]
_.file = { path = ".env", optional = true }

[tasks.init]
description = "Rename this template to a new project (see scripts/init.py)"
run = "python3 scripts/init.py"

[tasks.install]
description = "uv sync (all groups)"
run = "uv sync --all-groups"

[tasks.lint]
description = "ruff check + ruff format --check"
run = ["uv run ruff check .", "uv run ruff format --check ."]

[tasks.format]
description = "ruff format + ruff check --fix"
run = ["uv run ruff format .", "uv run ruff check --fix ."]

[tasks.typecheck]
description = "basedpyright strict"
run = "uv run basedpyright"

[tasks.test]
description = "pytest with coverage"
run = "uv run pytest"

[tasks.ci]
description = "Full CI gate"
depends = ["lint", "typecheck", "test"]

# Local mirror of the `zizmor` CI job. Not part of `ci` because it needs
# network access and a GitHub token for the online audits.
#
# Without a token zizmor silently falls back to offline and skips the
# `impostor-commit` and `known-vulnerable-actions` audits, which is an
# unverified result, not a pass — so refuse to run rather than exit 0 on
# a weaker check than the name promises.
#
# The zizmor version here must match `version:` in the workflow's zizmor
# job; bump them together.
[tasks.audit]
description = "zizmor audit of GitHub Actions workflows + dependabot config"
run = """
set -e
GH_TOKEN=$(gh auth token 2>/dev/null) || true
if [ -z "$GH_TOKEN" ]; then
  echo "No GitHub token: run \\`gh auth login\\`. Refusing to run a" >&2
  echo "partial audit — the online audits would be silently skipped." >&2
  exit 1
fi
export GH_TOKEN
uvx zizmor@1.29.0 --collect=all --strict-collection .
"""

# Mutates the GitHub remote. Idempotent: `--force` creates a missing
# label and updates an existing one. This block is the authoritative
# definition of the label set; docs/agents/issue-tracker.md describes
# what the labels mean and points here for names and colours.
[tasks.labels]
description = "Create/refresh triage labels on the GitHub remote (mutates the remote)"
run = """
set -e
gh label create bug             -c d73a4a -d "Something isn't working"                        --force
gh label create documentation   -c 0075ca -d "Improvements or additions to documentation"     --force
gh label create enhancement     -c a2eeef -d "New feature or request"                         --force
gh label create needs-triage    -c e6e6fa -d "Maintainer needs to evaluate this issue"        --force
gh label create needs-info      -c e6e6fa -d "Waiting on reporter for more information"       --force
gh label create ready-for-agent -c e6e6fa -d "Fully specified, ready for an autonomous agent"  --force
gh label create ready-for-human -c e6e6fa -d "Requires human implementation"                  --force
gh label create wontfix         -c ffffff -d "This will not be worked on"                     --force
"""

[tasks.ci-watch]
description = "Watch GitHub Actions CI for the current branch; exits non-zero on failure"
run = """
sleep 5
remote_url=$(git remote get-url upstream 2>/dev/null || git remote get-url origin)
repo=$(echo "$remote_url" | sed -E 's|^.*github\\.com[:/]||; s|\\.git$||')
run_id=$(gh run list --repo "$repo" --branch "$(git branch --show-current)" --limit 1 --json databaseId --jq '.[0].databaseId')
if [ -z "$run_id" ]; then echo "No run found for current branch on $repo" >&2; exit 1; fi
gh run watch --repo "$repo" --exit-status "$run_id"
"""
